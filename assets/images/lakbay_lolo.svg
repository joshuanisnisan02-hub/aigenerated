<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1000">
  <defs>
    <linearGradient id="barong" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#eadfca"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7b276"/>
      <stop offset="1" stop-color="#d97d47"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" x2="1">
      <stop offset="0" stop-color="#e9c98b"/>
      <stop offset="1" stop-color="#b8874d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#173A5E" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- legs -->
    <path d="M270 720 L350 720 L338 930 Q330 962 298 962 Q274 962 270 935 Z" fill="#17294d"/>
    <path d="M350 720 L430 720 L436 930 Q430 962 398 962 Q372 962 368 935 Z" fill="#20345f"/>
    <path d="M270 925 Q315 918 345 937 L340 970 L250 970 Q250 944 270 925Z" fill="#7a431f"/>
    <path d="M380 937 Q420 918 452 936 L462 970 L372 970 Q366 950 380 937Z" fill="#7a431f"/>

    <!-- body/barong -->
    <path d="M208 390 Q238 325 312 302 L388 302 Q468 325 500 392 L520 710 Q442 750 350 748 Q258 750 180 710 Z" fill="url(#barong)" stroke="#d6c39d" stroke-width="4"/>
    <path d="M333 326 L367 326 L380 560 L320 560 Z" fill="#f7f0df" stroke="#c6a874" stroke-width="3"/>
    <circle cx="350" cy="372" r="6" fill="#ad7c31"/>
    <circle cx="350" cy="420" r="6" fill="#ad7c31"/>
    <circle cx="350" cy="468" r="6" fill="#ad7c31"/>
    <circle cx="350" cy="516" r="6" fill="#ad7c31"/>

    <!-- barong embroidery -->
    <g fill="none" stroke="#c59b59" stroke-width="5" opacity=".72">
