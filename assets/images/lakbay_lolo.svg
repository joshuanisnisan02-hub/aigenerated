    <path d="M290 205 Q320 190 338 207" fill="none" stroke="#6c6d70" stroke-width="10" stroke-linecap="round"/>
    <path d="M362 207 Q385 190 414 205" fill="none" stroke="#6c6d70" stroke-width="10" stroke-linecap="round"/>

    <!-- eyes -->
    <ellipse cx="315" cy="225" rx="17" ry="11" fill="#fff"/>
    <ellipse cx="385" cy="225" rx="17" ry="11" fill="#fff"/>
    <circle cx="316" cy="226" r="7" fill="#32261e"/>
    <circle cx="384" cy="226" r="7" fill="#32261e"/>
    <circle cx="318" cy="223" r="2" fill="#fff"/>
    <circle cx="386" cy="223" r="2" fill="#fff"/>

    <!-- nose -->
    <path d="M350 224 Q334 257 350 265 Q369 260 365 247" fill="none" stroke="#b96134" stroke-width="4" stroke-linecap="round"/>

    <!-- moustache -->
    <path d="M300 278 Q330 261 349 280 Q368 260 402 278 Q381 307 351 294 Q321 307 300 278Z" fill="#f2f2ec" stroke="#8d8f94" stroke-width="4"/>

    <!-- smile/mouth -->
    <path d="M312 295 Q350 330 389 295 Q373 335 350 337 Q326 335 312 295Z" fill="#6d291f"/>
    <path d="M323 302 Q350 318 378 302" stroke="#fff" stroke-width="9" stroke-linecap="round"/>

    <!-- salakot -->
    <path d="M205 138 Q350 43 495 138 Q454 165 350 169 Q246 165 205 138Z" fill="url(#hat)" stroke="#8e6134" stroke-width="5"/>
    <path d="M282 120 Q350 22 418 120" fill="#d7ac6d" stroke="#8e6134" stroke-width="5"/>
    <path d="M350 20 L362 48 L338 48 Z" fill="#9b6a39"/>
    <g stroke="#8f6b3e" stroke-width="3" opacity=".45">
      <path d="M260 130 L350 50 L440 130"/>
      <path d="M290 139 L350 75 L410 139"/>
      <path d="M315 145 L350 95 L385 145"/>
    </g>

    <!-- bead necklace -->
    <path d="M292 330 Q350 370 410 330" fill="none" stroke="#6d421f" stroke-width="10" stroke-linecap="round"/>
    <g fill="#a86825">
      <circle cx="304" cy="340" r="7"/><circle cx="322" cy="350" r="7"/><circle cx="342" cy="357" r="7"/><circle cx="362" cy="357" r="7"/><circle cx="382" cy="350" r="7"/><circle cx="400" cy="340" r="7"/>
    </g>
