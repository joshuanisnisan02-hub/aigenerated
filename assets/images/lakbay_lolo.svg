      <path d="M450 420 C415 450 420 520 455 550 C415 560 400 610 430 650"/>
      <path d="M285 390 C310 420 302 470 278 495"/>
      <path d="M415 390 C390 420 398 470 422 495"/>
    </g>
    <g fill="#c59b59" opacity=".65">
      <circle cx="250" cy="458" r="8"/><circle cx="273" cy="500" r="7"/><circle cx="252" cy="560" r="8"/><circle cx="273" cy="615" r="7"/>
      <circle cx="450" cy="458" r="8"/><circle cx="427" cy="500" r="7"/><circle cx="448" cy="560" r="8"/><circle cx="427" cy="615" r="7"/>
    </g>

    <!-- arms -->
    <path d="M215 410 Q140 455 125 555 Q128 590 162 595 Q200 565 246 500 Z" fill="url(#barong)" stroke="#d6c39d" stroke-width="4"/>
    <path d="M486 420 Q542 468 544 566 Q530 592 502 582 Q474 526 447 488 Z" fill="url(#barong)" stroke="#d6c39d" stroke-width="4"/>

    <!-- welcoming hand -->
    <path d="M132 542 Q100 523 82 501 Q64 480 76 464 Q88 451 104 468 L126 489 Q120 461 135 458 Q150 459 154 478 L159 498 Q165 469 180 472 Q196 478 188 505 L180 542 Q170 572 145 572 Z" fill="url(#skin)" stroke="#b96134" stroke-width="4"/>
    <!-- resting hand -->
    <path d="M487 544 Q457 533 442 548 Q427 564 442 582 Q463 601 497 586 Q511 567 487 544Z" fill="url(#skin)" stroke="#b96134" stroke-width="4"/>

    <!-- neck -->
    <rect x="317" y="278" width="66" height="70" rx="28" fill="url(#skin)"/>

    <!-- head -->
    <ellipse cx="350" cy="228" rx="110" ry="125" fill="url(#skin)" stroke="#b96134" stroke-width="5"/>

    <!-- ears -->
    <ellipse cx="245" cy="237" rx="25" ry="36" fill="#e9955d" stroke="#b96134" stroke-width="4"/>
    <ellipse cx="455" cy="237" rx="25" ry="36" fill="#e9955d" stroke="#b96134" stroke-width="4"/>

    <!-- hair -->
    <path d="M263 180 Q275 115 345 108 Q420 110 440 178 Q420 153 392 148 Q350 136 310 151 Q284 158 263 180Z" fill="#e8e8e2" stroke="#8d8f94" stroke-width="5"/>
    <path d="M255 184 Q235 206 244 260 Q252 214 272 193Z" fill="#d6d8d8"/>
    <path d="M445 184 Q465 206 456 260 Q448 214 428 193Z" fill="#d6d8d8"/>

