name: Publish Lakbay Kasaysayan AI for GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lakbay-pages-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter web platform files
        run: flutter create --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web app
        run: flutter build web --release --base-href "/aigenerated/app/"

      - name: Copy production build into Pages folder
        run: |
          rm -rf app
          mkdir -p app
          cp -R build/web/. app/
          touch app/.nojekyll

      - name: Commit production site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app
          if git diff --cached --quiet; then
            echo "No production build changes to publish."
            exit 0
          fi
          git commit -m "Publish Lakbay Kasaysayan web build [skip ci]"
          git push origin HEAD:main
